name: Reproduce H4 and H8 on CPU (no competition upload)

on:
  workflow_dispatch:
  # Also verify workflow changes through normal PR permissions. This avoids
  # requiring an external integration to have Actions-dispatch privileges.
  pull_request:
    paths: ['.github/workflows/reproduce.yml']

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-research.txt && python -m pip install -e .
      - name: Restore hash-pinned inputs, without manual data placement
        run: bash scripts/download_competition_data.sh && python scripts/prepare_data.py
      - name: Restore every raw TIFF in the frozen reachable-history inventory
        run: python scripts/fetch_prior_cache.py --inventory docs/data/prior-inventory-20261006.json --cache data/prior
      - name: Compute independently from the magnetic and gravity source layers (H4, retained)
        run: python scripts/run_contact_euler.py --output work/h4-reproduction
      - name: Recompute the current H8 candidate from the magnetic and gravity source layers
        run: python scripts/run_h8_lineament.py
      - name: Re-audit the recomputed H8 candidate and require byte-identical artifacts
        run: |
          python scripts/audit_h8_lineament.py
          python - <<'EOF'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path("docs/data/current-candidate.json").read_text())
          receipt = json.loads(pathlib.Path("work/h8lineament/h8-lineament-receipt.json").read_text())
          again = receipt["emission"]["continuous"]
          published = hashlib.sha256(pathlib.Path(manifest["path"]).read_bytes()).hexdigest()
          print("recomputed", again["sha256"], "published", published)
          if again["canonical_pixels_sha256"] != manifest["canonical_pixels_sha256"]:
              sys.exit("recomputed pixels differ from the published candidate")
          EOF
      - name: Require byte-identical reproduction of TIFF and point cloud
        run: python scripts/verify_reproduction.py
      - name: Repeat the fixed raw-output audit and blocked scores, without tuning
        run: python scripts/audit_contact_candidate.py --work work/h4-reproduction
      - name: Verify unchanged HOLD decision and artifact identities
        run: python scripts/build_site.py --check
      - name: Retain research evidence, not a competition submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h4-cpu-reproduction
          retention-days: 14
          path: |
            work/h4-reproduction/generation.json
            work/h4-reproduction/uniqueness.json
            docs/data/h4-*.json
            docs/data/current-candidate.json
            docs/data/h8-lineament-audit.json
            docs/downloads/gemsdoe40-h4-*.tif
            docs/downloads/gemsdoe40-h8-*.tif
            docs/downloads/h4-euler-solutions.csv.gz
            docs/downloads/h8-lineament-solutions.csv.gz
