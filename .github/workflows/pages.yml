name: Publish verified research site

on:
  push:
    branches: [main]
    paths: ['docs/**', 'index.html', 'README.md', 'scripts/build_h41_site.py', 'scripts/build_h8_site.py', 'scripts/build_site.py', 'scripts/build_contact_site.py', 'scripts/update_source_feed.py', 'scripts/stage_pages.py', 'src/gemsdoe40/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select one Pages publisher and prevent legacy deployment races
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          test "$mode" = workflow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check immutable release bytes and no-go evidence
        run: python scripts/build_site.py --check
      - name: Refresh only permitted official-source context
        # No DrivenData scraping. No model change, scoring, promotion or upload.
        # A failed API refresh is published as stale, not concealed.
        run: python scripts/update_source_feed.py --restore-live
      - name: Stage both the supplied /docs/ URLs and historical root aliases
        run: python scripts/stage_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the real public URLs and both TIFF download hashes
        run: python scripts/verify_deployed_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-delivery-verification
          retention-days: 30
          path: work/deployment-verification.json
