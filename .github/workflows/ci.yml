name: Research and site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested numerical environment
        run: python -m pip install -r requirements-research.txt && python -m pip install -e .
      - name: Analytic, integrity, acquisition and site unit tests
        run: python -m pytest -q
      - name: Verify links, actual release bytes, full corpus and no-go evidence
        run: python scripts/build_site.py --check
      - name: Verify deterministic current HTML generation
        run: |
          python scripts/build_contact_site.py
          git diff --exit-code -- docs/*.html index.html
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Install browser for real desktop/mobile QA
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Check public routing, download, clipboard and project search in Chromium
        run: |
          python scripts/stage_pages.py
          python scripts/check_site_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          retention-days: 14
          path: |
            work/browser-checks.json
            work/browser-screenshots/
