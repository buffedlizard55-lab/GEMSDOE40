name: Research and site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install both research packages and tests
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Verify current static site without rewriting it
        run: python scripts/build_site.py --check
      - name: Compile Python sources
        run: python -m compileall -q src scripts
