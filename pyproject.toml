[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems40"
version = "0.1.0"
description = "Euler-deconvolution depth-clustering submission generator for the DOE GEMS Prize (DrivenData #306)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "rasterio>=1.3", "pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
