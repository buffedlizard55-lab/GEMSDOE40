[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe40"
version = "0.1.0"
description = "Euler deconvolution depth-clustering for the DOE GEMS Prize"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "rasterio", "tifffile"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
