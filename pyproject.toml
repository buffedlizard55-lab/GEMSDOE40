[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe40"
version = "0.1.0"
description = "Auditable fault-prediction research for DOE GEMS"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "rasterio>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["gemsdoe40"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
