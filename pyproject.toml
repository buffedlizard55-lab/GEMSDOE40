[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gems40"
version = "0.1.0"
description = "Euler deconvolution and auditable fault-prediction research for DOE GEMS"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "rasterio>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gems40*", "gemsdoe40*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
